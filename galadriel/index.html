<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galadriel</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The mirror does not open this way." />
    <style>
      :root {
        --void: #000;
        --mist: #a0a0a0;
        --leaf: #00ff88;
        --panel: #1a1a1a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem max(0.75rem, 3vw);
        background:
          radial-gradient(ellipse 80% 55% at 50% -10%, rgba(0, 255, 136, 0.12), transparent 55%),
          radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 255, 136, 0.05), transparent 50%),
          var(--void);
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
        overflow-x: hidden;
      }
      main {
        width: min(100%, 42rem);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .ring {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 0 1.75rem;
        border-radius: 50%;
        border: 2px solid var(--leaf);
        box-shadow:
          0 0 0 10px rgba(0, 255, 136, 0.06),
          0 0 40px rgba(0, 255, 136, 0.2);
        position: relative;
        animation: pulse 4.5s ease-in-out infinite;
        flex-shrink: 0;
      }
      .ring::after {
        content: "";
        position: absolute;
        inset: 28%;
        border-radius: 50%;
        background: var(--leaf);
        opacity: 0.9;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow:
            0 0 0 10px rgba(0, 255, 136, 0.06),
            0 0 32px rgba(0, 255, 136, 0.18);
        }
        50% {
          box-shadow:
            0 0 0 14px rgba(0, 255, 136, 0.1),
            0 0 56px rgba(0, 255, 136, 0.28);
        }
      }
      p.eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--leaf);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      h1 {
        margin: 0 0 1rem;
        /* Scale so the full line fits the viewport; stays one line on phone + desktop */
        font-size: min(2.75rem, calc((100vw - 2rem) / 17.5));
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
        white-space: nowrap;
        text-align: center;
        max-width: 100%;
      }
      p.lede {
        margin: 0 0 1.75rem;
        color: var(--mist);
        line-height: 1.55;
        font-size: clamp(0.92rem, 2.8vw, 1.02rem);
        max-width: 28rem;
      }
      .panel {
        margin: 0 0 1.75rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2a2a;
        background: var(--panel);
        color: var(--mist);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: min(0.78rem, calc((100vw - 2rem) / 42));
        letter-spacing: 0.02em;
        white-space: nowrap;
        max-width: 100%;
        box-sizing: border-box;
      }
      a {
        display: inline-block;
        color: var(--void);
        background: var(--leaf);
        text-decoration: none;
        font-weight: 650;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.85rem 1.25rem;
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      a:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }
      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ring" aria-hidden="true"></div>
      <p class="eyebrow">galadriel // mirror</p>
      <h1>Even the wisest cannot see all ends.</h1>
      <p class="lede">
        You found a private mirror.<br />
        It counts quietly for
        <strong style="color: #fff">dannyvoid.com</strong>.<br />
        It does not open for wandering guests.
      </p>
      <p class="panel">status: sealed &nbsp;·&nbsp; seekers: redirected &nbsp;·&nbsp; void: intact</p>
      <a href="https://dannyvoid.com/">Return to the void</a>
    </main>
  </body>
</html>
